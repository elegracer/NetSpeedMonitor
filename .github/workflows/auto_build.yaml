name: Build and Release

on:
  push:
    branches: [ master ]
    tags: [ "v*" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Create Build Directory
      run: mkdir -p build

    - name: Verify Xcode Toolchain
      run: |
        xcodebuild -version
        MIN_MACOS_VERSION=$(awk -F ' *= *' '/^MACOSX_DEPLOYMENT_TARGET/ { print $2 }' Version.xcconfig)
        REQUIRED_SDK_MAJOR="${MIN_MACOS_VERSION%%.*}"
        SDK_VERSION=$(xcrun --sdk macosx --show-sdk-version)
        echo "macOS SDK: $SDK_VERSION"
        if [[ "${SDK_VERSION%%.*}" -lt "$REQUIRED_SDK_MAJOR" ]]; then
          echo "::error::macOS ${REQUIRED_SDK_MAJOR} SDK or newer is required"
          exit 1
        fi

    - name: Verify Version Consistency
      run: scripts/check-version-consistency.sh "${GITHUB_REF_TYPE}" "${GITHUB_REF_NAME}"

    - name: Run Logic Tests
      run: |
        xcrun swiftc NetSpeedMonitor/AppSettings.swift NetSpeedMonitor/UpdateValidation.swift NetSpeedMonitor/ReleaseSignature.swift Tests/main.swift -o build/swift-logic-tests
        build/swift-logic-tests
        xcrun swiftc NetSpeedMonitor/AppSettings.swift NetSpeedMonitor/UpdateValidation.swift NetSpeedMonitor/ReleaseSignature.swift NetSpeedMonitor/UpdateInstaller.swift Tests/UpdateInstallerTests.swift -o build/update-installer-tests
        build/update-installer-tests
        xcrun swiftc NetSpeedMonitor/AppSettings.swift NetSpeedMonitor/ReleaseProvider.swift Tests/ReleaseProviderTests.swift -o build/release-provider-tests
        build/release-provider-tests
        xcrun swiftc NetSpeedMonitor/RouteInterfaceResolver.swift Tests/RouteInterfaceResolverTests.swift -o build/route-resolver-tests
        build/route-resolver-tests
        xcrun swiftc NetSpeedMonitor/TrafficHistory.swift Tests/TrafficHistoryTests.swift -o build/traffic-history-tests
        build/traffic-history-tests
        xcrun swiftc NetSpeedMonitor/InterfaceNameResolver.swift Tests/InterfaceNameResolverTests.swift -o build/interface-name-tests
        build/interface-name-tests
        xcrun swiftc NetSpeedMonitor/MenuBarIconGenerator.swift Tests/MenuBarIconGeneratorTests.swift -o build/menu-bar-layout-tests
        build/menu-bar-layout-tests
        xcrun clang++ -std=c++17 Tests/NetTrafficStatTests.cpp -o build/traffic-tests
        build/traffic-tests
        xcrun clang++ -std=c++17 Tests/NetTrafficRuntimeTests.cpp NetSpeedMonitor/NetTrafficStatCpp.cpp -o build/traffic-runtime-tests
        build/traffic-runtime-tests

    - name: Build with Xcode
      run: |
        VERSION=$(awk -F ' *= *' '/^MARKETING_VERSION/ { print $2 }' Version.xcconfig)
        RELEASE_TAG="v${VERSION}"
        if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then RELEASE_TAG="${GITHUB_REF_NAME}"; fi
        echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"
        xcodebuild \
          -project NetSpeedMonitor.xcodeproj \
          -scheme NetSpeedMonitor \
          -configuration Release \
          ARCHS="x86_64 arm64" \
          ONLY_ACTIVE_ARCH=NO \
          -destination 'generic/platform=macOS' \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO \
          NETSPEED_RELEASE_TAG="$RELEASE_TAG" \
          CONFIGURATION_BUILD_DIR=build/Release \
          clean build

    - name: Verify Architectures
      run: |
        EXECUTABLE="build/Release/NetSpeedMonitor.app/Contents/MacOS/NetSpeedMonitor"
        LIPO_OUTPUT=$(lipo -info "$EXECUTABLE")
        BUILD_OUTPUT=$(xcrun vtool -show-build "$EXECUTABLE")
        echo "Binary Architectures: $LIPO_OUTPUT"
        echo "$BUILD_OUTPUT"
        if [[ ! $LIPO_OUTPUT == *"x86_64"* || ! $LIPO_OUTPUT == *"arm64"* ]]; then
          echo "::error::Missing required architectures!"
          exit 1
        fi
        REQUIRED_SDK_MAJOR=$(awk -F ' *= *' '/^MACOSX_DEPLOYMENT_TARGET/ { print int($2) }' Version.xcconfig)
        if [[ ! $BUILD_OUTPUT =~ sdk[[:space:]]+${REQUIRED_SDK_MAJOR}\. ]]; then
          echo "::error::Release binary was not linked against the macOS ${REQUIRED_SDK_MAJOR} SDK"
          exit 1
        fi

    - name: Sign Application
      run: |
        codesign --force --deep --sign - \
          --entitlements NetSpeedMonitor/NetSpeedMonitor.entitlements \
          --options=runtime \
          "build/Release/NetSpeedMonitor.app"

    - name: Sanitize Metadata
      run: |
        xattr -cr "build/Release/NetSpeedMonitor.app"
        plutil -replace CFBundleSupportedPlatforms -json '["MacOSX"]' \
          "build/Release/NetSpeedMonitor.app/Contents/Info.plist"
        codesign --force --deep --sign - \
          --entitlements NetSpeedMonitor/NetSpeedMonitor.entitlements \
          --options=runtime \
          "build/Release/NetSpeedMonitor.app"
        codesign --verify --deep --strict "build/Release/NetSpeedMonitor.app"

    - name: Create Distribution Package
      run: |
        cd build/Release
        COPYFILE_DISABLE=1 ditto -c -k --norsrc --keepParent NetSpeedMonitor.app NetSpeedMonitor.zip
        shasum -a 256 NetSpeedMonitor.zip > NetSpeedMonitor.sha256

    - name: Sign Distribution Package
      env:
        RELEASE_SIGNING_PRIVATE_KEY_BASE64: ${{ secrets.RELEASE_SIGNING_PRIVATE_KEY_BASE64 }}
      run: |
        if [[ -z "$RELEASE_SIGNING_PRIVATE_KEY_BASE64" ]]; then
          echo "::error::RELEASE_SIGNING_PRIVATE_KEY_BASE64 is not configured"
          exit 1
        fi
        umask 077
        KEY_FILE=$(mktemp)
        trap 'rm -f "$KEY_FILE"' EXIT
        printf '%s' "$RELEASE_SIGNING_PRIVATE_KEY_BASE64" > "$KEY_FILE"
        xcrun swift scripts/sign-release.swift "$KEY_FILE" "$RELEASE_TAG" build/Release/NetSpeedMonitor.zip
        xcrun swift scripts/verify-release.swift "$RELEASE_TAG" build/Release/NetSpeedMonitor.zip build/Release/NetSpeedMonitor.sig

    - name: Upload Artifacts (Master)
      if: github.ref == 'refs/heads/master'
      uses: actions/upload-artifact@v6
      with:
        name: universal-build-${{ github.sha }}
        path: |
          build/Release/NetSpeedMonitor.zip
          build/Release/NetSpeedMonitor.sha256
          build/Release/NetSpeedMonitor.sig

    - name: Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v3
      with:
        draft: false
        prerelease: ${{ contains(github.ref_name, '-') }}
        body_path: RELEASE_NOTES.md
        files: |
          build/Release/NetSpeedMonitor.zip
          build/Release/NetSpeedMonitor.sha256
          build/Release/NetSpeedMonitor.sig
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
